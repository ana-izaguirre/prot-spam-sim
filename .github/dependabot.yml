version: 2

updates:
  # Application and tooling dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the routine patch and minor bumps; majors stay separate so a
      # breaking change is never buried in a batch of housekeeping.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The pinned action versions in the workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
