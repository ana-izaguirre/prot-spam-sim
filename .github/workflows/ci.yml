name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request, a newer push makes the running check irrelevant, so cancel it.
# On main it must not be cancelled: that run owns the production deploy, and
# aborting it mid-flight leaves the deployed site at an arbitrary earlier commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages serves a project site from /<repo>/, so the production build must
# emit that prefix. It is defined once, at workflow level, because the build, the
# preview server and the smoke suite all have to agree on it: a site built for a
# base path but served from the root loads its HTML and none of its assets.
env:
  BASE_PATH: ${{ github.ref == 'refs/heads/main' && format('/{0}/', github.event.repository.name) || '/' }}

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint:js

      - name: Type-check (astro check)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Set the SITE_URL repository variable to the production origin so the
          # build emits canonical and og:url tags. Without it they are omitted.
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Check the build produced what it should
        run: |
          set -euo pipefail
          for f in dist/index.html dist/404.html dist/robots.txt dist/favicon.svg; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
          # The island must be prerendered: an empty root means the page ships no
          # HTML and the Astro migration has silently regressed to client-only.
          grep -q 'ProtSpam HPC Suite' dist/index.html \
            || { echo "::error::dist/index.html has no prerendered markup"; exit 1; }
          echo "Initial HTML: $(stat -c%s dist/index.html) bytes"

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: Smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the smoke suite against the built site
        # BASE_PATH comes from the workflow env: `astro preview` serves at that
        # prefix and Playwright's baseURL uses it, so the suite exercises the
        # artifact exactly as Pages will serve it.
        run: npm test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, smoke]
    # Pages publishes one site per repository, so only main deploys. Pull
    # requests still run check and smoke; they simply have nowhere to publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repository, so there is nothing to deploy to. Enable it at Settings > Pages > Source > 'GitHub Actions', then re-run this workflow. Everything else in the pipeline has already passed."
            exit 1
          fi
          echo "Pages is enabled (HTTP $code)."

      - name: Package it for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: pages
        uses: actions/deploy-pages@v5

      - name: Verify the deployment is actually serving
        run: |
          set -euo pipefail
          url="${{ steps.pages.outputs.page_url }}"

          # Pages can answer before the deploy has propagated to the edge.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $attempt: HTTP $code, retrying in 10s"
            sleep 10
          done

          [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; exit 1; }
          grep -q 'ProtSpam HPC Suite' body.html \
            || { echo "::error::$url responded but served no prerendered markup"; exit 1; }
          echo "$url is up and serving prerendered HTML"

          {
            echo "### Deployed"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
